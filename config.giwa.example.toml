# x402 facilitator - GIWA Sepolia, erc7710 mode.
# Setting delegationManager switches the facilitator to the x402 v2 "exact" scheme's erc7710
# asset-transfer method: verification is simulation of the pinned ERC-7710 delegation manager,
# and ALL policy (caps, payees, windows, identity) lives on-chain behind it.
scheme = "exact"
network = "eip155:91342"
port = 8402
url = "https://sepolia-rpc.giwa.io"
privateKey = "<fee-payer private key, hex without 0x>"
delegationManager = "0xfd0fCCCcF8071852783b5133b3CC47461f33e6Cd"

# Requests per second per client IP on /verify and /settle. A public facilitator is a key holding
# gas: without this it is a faucet anyone can drain by asking it to broadcast. Leave unset when the
# endpoint is private.
settleRateLimit = 2
settleBurst = 5

# Where broadcast-but-unconfirmed settlements are recorded, so a restart resolves them against the
# chain instead of forgetting a payment it already sent.
pendingLog = "/var/lib/x402-facilitator/pending.json"
